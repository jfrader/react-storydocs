name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts, typecheck and consumer builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: storybook-docs
    steps:
      - name: Checkout engine
        uses: actions/checkout@v6
        with:
          path: storybook-docs
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: storybook-docs/package.json

      - name: Set up Node 22.23.3 and pnpm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: |
            storybook-docs/pnpm-lock.yaml
            storybook-docs/examples/fixtures/pnpm-lock.yaml
            storybook-docs/examples/jfrader-ui/pnpm-lock.yaml

      - name: Install engine dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install fixture consumer dependencies
        run: pnpm --dir examples/fixtures install --frozen-lockfile --prefer-offline

      - name: Test engine, virtual modules, packed exports and fixtures graph
        run: pnpm test

      - name: Typecheck engine and tests
        run: pnpm typecheck

      - name: Check reference checkout credentials
        id: reference
        env:
          REFERENCE_UI_TOKEN: ${{ secrets.REFERENCE_UI_TOKEN }}
        run: |
          if [ -z "$REFERENCE_UI_TOKEN" ]; then
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::notice::REFERENCE_UI_TOKEN is not set — skipping the jfrader-ui reference build. The self-contained examples/fixtures consumer below still exercises the full build pipeline."
          else
            echo "present=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the self-contained fixtures consumer
        run: pnpm --dir examples/fixtures build

      - name: Checkout reference design system
        if: ${{ steps.reference.outputs.present == '1' }}
        uses: actions/checkout@v6
        with:
          repository: jfrader/jfrader-ui
          ref: c990db09c143a183f5666d404c35cf2fe324cf9d
          token: ${{ secrets.REFERENCE_UI_TOKEN }}
          path: jfrader-ui
          persist-credentials: false

      - name: Install reference design system dependencies
        if: ${{ steps.reference.outputs.present == '1' }}
        run: pnpm --dir ../jfrader-ui --filter @jfrader/ui... install --frozen-lockfile --prefer-offline

      - name: Generate reference tokens
        if: ${{ steps.reference.outputs.present == '1' }}
        run: pnpm --dir ../jfrader-ui --filter @jfrader/tokens generate

      - name: Install reference consumer dependencies
        if: ${{ steps.reference.outputs.present == '1' }}
        run: pnpm --dir examples/jfrader-ui install --frozen-lockfile --prefer-offline

      - name: Build reference consumer
        if: ${{ steps.reference.outputs.present == '1' }}
        run: pnpm build
